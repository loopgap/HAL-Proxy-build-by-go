name: Release Backfill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to backfill if the normal release workflow did not create it
        required: true
        default: v0.4.3

permissions:
  contents: write

env:
  TARGET_TAG: ${{ github.event.inputs.tag || 'v0.4.3' }}

jobs:
  backfill:
    name: Backfill historical release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TARGET_TAG;
            const { owner, repo } = context.repo;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Tag ${tag} does not exist on the remote.`);
                return;
              }
              throw error;
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.notice(`Release already exists for ${tag}: ${existing.data.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const notesPath = `docs/releases/${tag}.md`;
            const body = fs.existsSync(notesPath)
              ? fs.readFileSync(notesPath, 'utf8')
              : `Historical release backfill for ${tag}.`;

            const historicalBackfill = tag === 'v0.1.0';
            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `BridgeOS ${tag}`,
              body,
              draft: false,
              prerelease: historicalBackfill,
              make_latest: historicalBackfill ? 'false' : 'true',
            });
            core.notice(`Created release ${release.data.html_url}`);
