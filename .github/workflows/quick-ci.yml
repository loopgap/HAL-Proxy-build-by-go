name: Quick CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: quick-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast Go checks
  go-quick:
    name: Go Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Quick build
        run: go build -v ./...

      - name: Quick vet
        run: go vet ./...

  # Fast frontend checks
  frontend-quick:
    name: Frontend Quick Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: TypeScript check
        working-directory: ui
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: ui
        run: npm run lint


  # Hardcoded secret scan
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if git log --all --diff-filter=A --name-only --format="" | xargs grep -l -E "(password|secret|api_key|token|private_key)\s*[:=]\s*['\"][^'\"]{8,}" 2>/dev/null; then
            echo "WARNING: Potential hardcoded secrets found in git history"
            echo "Review the files above and rotate any exposed credentials"
          fi
          echo "Scanning current codebase..."
          if grep -r -l -E "(password|secret|api_key|token|private_key)\s*[:=]\s*['\"][^'\"]{8,}" --include="*.go" --include="*.ts" --include="*.tsx" --include="*.js" . 2>/dev/null | grep -v node_modules | grep -v ".test." | grep -v "testdata"; then
            echo "ERROR: Hardcoded secrets found in current codebase!"
            exit 1
          fi
          echo "No hardcoded secrets found."

  # Fast security checks
  security-quick:
    name: Security Quick Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Go vul check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: NPM audit
        working-directory: ui
        run: npm audit --audit-level=high


